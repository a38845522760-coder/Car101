name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract project zip (only on the runner, repo stays unchanged)
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Using $ZIP"
          mkdir -p /tmp/work
          unzip -q "$ZIP" -d /tmp/work
          PROJECT=$(dirname "$(find /tmp/work -name project.godot | head -1)")
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Download model zips from release (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view assets >/dev/null 2>&1; then
            mkdir -p /tmp/rel
            gh release download assets --pattern "*.zip" --dir /tmp/rel
            for z in /tmp/rel/*.zip; do
              name=$(basename "$z" .zip)
              if [ "$name" = "assets" ]; then
                unzip -q -o "$z" -d "$PROJECT_DIR/assets"
              elif echo "$name" | grep -qi "map"; then
                mkdir -p "$PROJECT_DIR/assets/city/$name"
                unzip -q -o "$z" -d "$PROJECT_DIR/assets/city/$name"
              else
                mkdir -p "$PROJECT_DIR/assets/cars/$name"
                unzip -q -o "$z" -d "$PROJECT_DIR/assets/cars/$name"
              fi
            done
          fi
          find "$PROJECT_DIR/assets" -type f | head -80

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "cmdline-tools;latest" "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot and export templates
        run: |
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/tmp
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d ~/.local/share/godot/export_templates/tmp
          mv ~/.local/share/godot/export_templates/tmp/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm -rf ~/.local/share/godot/export_templates/tmp

      - name: Debug keystore and editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Import assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: godot --headless --import || true

      - name: Export APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/citydrive.apk

      - uses: actions/upload-artifact@v4
        with:
          name: citydrive-apk
          path: ${{ env.PROJECT_DIR }}/build/citydrive.apk
