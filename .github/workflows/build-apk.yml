name: Build APK

on:
  push:
    branches: [main, master]
    # Do not waste a build when only the workflow definition itself changes.
    # Uploading/replacing CityDrive.zip still triggers the build.
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.1"
  ANDROID_PLATFORM_VERSION: "35"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Extract Godot project archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          ZIP_FILES=("$GITHUB_WORKSPACE"/*.zip)
          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No project ZIP file was found in the repository root."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one project ZIP in the repository root; found ${#ZIP_FILES[@]}."
            printf ' - %s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP="${ZIP_FILES[0]}"
          echo "Using project archive: $(basename "$ZIP")"
          mkdir -p /tmp/work
          unzip -q "$ZIP" -d /tmp/work

          mapfile -t PROJECT_FILES < <(find /tmp/work -type f -name project.godot -print)
          if [ "${#PROJECT_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one project.godot in the ZIP; found ${#PROJECT_FILES[@]}."
            exit 1
          fi

          PROJECT_DIR="$(dirname "${PROJECT_FILES[0]}")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project found at: $PROJECT_DIR"

      - name: Download optional asset archives from the assets release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/assets"

          if gh release view assets >/dev/null 2>&1; then
            mkdir -p /tmp/rel
            if gh release download assets --pattern "*.zip" --dir /tmp/rel; then
              shopt -s nullglob
              RELEASE_ZIPS=(/tmp/rel/*.zip)

              for archive in "${RELEASE_ZIPS[@]}"; do
                name="$(basename "$archive" .zip)"
                echo "Installing optional asset archive: $name"

                if [ "$name" = "assets" ]; then
                  unzip -q -o "$archive" -d "$PROJECT_DIR/assets"
                elif echo "$name" | grep -qi "map"; then
                  mkdir -p "$PROJECT_DIR/assets/city/$name"
                  unzip -q -o "$archive" -d "$PROJECT_DIR/assets/city/$name"
                else
                  mkdir -p "$PROJECT_DIR/assets/cars/$name"
                  unzip -q -o "$archive" -d "$PROJECT_DIR/assets/cars/$name"
                fi
              done
            else
              echo "::warning::The assets release exists, but no downloadable ZIP asset was found. Continuing with the project archive."
            fi
          else
            echo "No optional assets release found; continuing with the project archive."
          fi

          find "$PROJECT_DIR/assets" -type f -print | head -80 || true

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}"

      - name: Install Godot and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"

          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates"
          TEMPLATE_TMP="$TEMPLATE_ROOT/tmp"
          TEMPLATE_DEST="$TEMPLATE_ROOT/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_ROOT"
          rm -rf "$TEMPLATE_TMP" "$TEMPLATE_DEST"
          mkdir -p "$TEMPLATE_TMP"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d "$TEMPLATE_TMP"
          test -d "$TEMPLATE_TMP/templates"
          mv "$TEMPLATE_TMP/templates" "$TEMPLATE_DEST"
          rm -rf "$TEMPLATE_TMP"

          # Fail here, rather than during APK export, if the Android templates are missing.
          test -s "$TEMPLATE_DEST/android_debug.apk"
          test -s "$TEMPLATE_DEST/android_release.apk"
          godot --version

      - name: Configure Android debug keystore and Godot editor settings
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9999 \
            -alias androiddebugkey \
            -keypass android \
            -keystore "$HOME/debug.keystore" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype pkcs12

          mkdir -p "$HOME/.config/godot"
          # Godot 4.x stores editor settings by major.minor version (4.7), not just major (4).
          GODOT_SETTINGS_VERSION="${GODOT_VERSION%.*}"
          SETTINGS_FILE="$HOME/.config/godot/editor_settings-${GODOT_SETTINGS_VERSION}.tres"
          cat > "$SETTINGS_FILE" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          SETTINGS

          test -s "$SETTINGS_FILE"
          echo "Godot editor settings written to: $SETTINGS_FILE"

      - name: Check Android export preset
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PROJECT_DIR/export_presets.cfg"
          grep -Fq 'name="Android"' "$PROJECT_DIR/export_presets.cfg"
          grep -Fq 'platform="Android"' "$PROJECT_DIR/export_presets.cfg"
          echo "Android export preset found."

      - name: Import Godot project assets
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path "$PROJECT_DIR" --import

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/build"
          APK_PATH="$PROJECT_DIR/build/citydrive.apk"
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$APK_PATH"
          test -s "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null
          echo "APK export and ZIP integrity checks passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: citydrive-apk
          path: ${{ env.PROJECT_DIR }}/build/citydrive.apk
          if-no-files-found: error
          retention-days: 14
